<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Property - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            background: #1a1a2e;
            padding: 15px 0;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
            font-size: 1.4rem;
        }

        .form-container {
            max-width: 850px;
            margin: 40px auto;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .form-title {
            color: #1a1a2e;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 11px 14px;
        }

        .btn-save {
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 700;
        }

        .btn-save:hover {
            background: #3046c9;
            color: white;
        }

        .btn-back {
            border: 2px solid #4361ee;
            color: #4361ee;
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 700;
            text-decoration: none;
        }

        .btn-back:hover {
            background: #4361ee;
            color: white;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container">

        <a class="navbar-brand"
           href="/admin/dashboard">
            🏠 PGFlatFinder Admin
        </a>

    </div>
</nav>


<!-- Form -->
<div class="container form-container">

    <div class="form-card">

        <h2 class="form-title">
            <i class="fas fa-plus-circle"></i>
            Add New Property
        </h2>

        <p class="form-subtitle">
            Enter the PG or Flat details below.
        </p>


        <form th:action="@{/admin/properties/add}"
              th:object="${property}"
              method="post"
              enctype="multipart/form-data">

            <div class="row g-3">

                <!-- Title -->
                <div class="col-md-12">
                    <label class="form-label">
                        Property Title
                    </label>

                    <input type="text"
                           th:field="*{title}"
                           class="form-control"
                           placeholder="Example: Sunrise Boys PG"
                           required>
                </div>


                <!-- Type -->
                <div class="col-md-6">
                    <label class="form-label">
                        Property Type
                    </label>

                    <select th:field="*{type}"
                            class="form-select"
                            required>

                        <option value="">
                            Select Type
                        </option>

                        <option value="PG">
                            PG
                        </option>

                        <option value="Flat">
                            Flat
                        </option>

                    </select>
                </div>


                <!-- Gender -->
                <div class="col-md-6">
                    <label class="form-label">
                        Gender
                    </label>

                    <select th:field="*{gender}"
                            class="form-select"
                            required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Boys">
                            Boys
                        </option>

                        <option value="Girls">
                            Girls
                        </option>

                        <option value="Any">
                            Any
                        </option>

                    </select>
                </div>


                <!-- Location -->
                <div class="col-md-6">
                    <label class="form-label">
                        Location
                    </label>

                    <input type="text"
                           th:field="*{location}"
                           class="form-control"
                           placeholder="Example: Madanapalle"
                           required>
                </div>


                <!-- Address -->
                <div class="col-md-6">
                    <label class="form-label">
                        Full Address
                    </label>

                    <input type="text"
                           th:field="*{address}"
                           class="form-control"
                           placeholder="Enter full address"
                           required>
                </div>


                <!-- Google Maps Link -->
                <div class="col-md-12">
                    <label class="form-label">
                        Google Maps Link
                    </label>

                    <input type="text"
                           th:field="*{googleMapsLink}"
                           class="form-control"
                           placeholder="Paste Google Maps link"
                           required>
                </div>


                <!-- Rent -->
                <div class="col-md-6">
                    <label class="form-label">
                        Monthly Rent
                    </label>

                    <input type="number"
                           th:field="*{rent}"
                           class="form-control"
                           placeholder="Example: 5000"
                           min="0"
                           step="0.01"
                           required>
                </div>


                <!-- Rooms -->
                <div class="col-md-6">
                    <label class="form-label">
                        Number of Rooms
                    </label>

                    <input type="number"
                           th:field="*{rooms}"
                           class="form-control"
                           placeholder="Example: 2"
                           min="1"
                           required>
                </div>


                <!-- Owner Name -->
                <div class="col-md-6">
                    <label class="form-label">
                        Owner Name
                    </label>

                    <input type="text"
                           th:field="*{ownerName}"
                           class="form-control"
                           placeholder="Enter owner name"
                           required>
                </div>


                <!-- Contact Number -->
                <div class="col-md-6">
                    <label class="form-label">
                        Contact Number
                    </label>

                    <input type="tel"
                           th:field="*{contactNumber}"
                           class="form-control"
                           placeholder="Enter 10-digit phone number"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           required>
                </div>


                <!-- Description -->
                <div class="col-md-12">
                    <label class="form-label">
                        Description
                    </label>

                    <textarea th:field="*{description}"
                              class="form-control"
                              rows="5"
                              placeholder="Describe the property">
                    </textarea>
                </div>
                <!-- Food Available -->
                <div class="col-md-12">

                    <div class="form-check">

                        <input type="checkbox"
                               th:field="*{foodAvailable}"
                               class="form-check-input"
                               id="foodAvailable">

                        <label class="form-check-label"
                               for="foodAvailable">
                            Food is available for this property
                        </label>

                    </div>

                </div>


                <!-- Weekly Food Menu -->
                <div class="col-md-12">

                    <label class="form-label">
                        Weekly Food Menu
                    </label>

                    <textarea th:field="*{foodMenu}"
                              class="form-control"
                              rows="7"
                              placeholder="Example:
Monday: Idli | Rice + Dal | Chapati + Curry
Tuesday: Dosa | Sambar Rice | Rice + Curry
Wednesday: Upma | Rice + Dal | Chapati
Thursday: Pongal | Veg Biryani | Rice + Curry
Friday: Dosa | Rice + Sambar | Chapati
Saturday: Poori | Fried Rice | Rice + Dal
Sunday: Special Breakfast | Biryani | Light Dinner">
    </textarea>

                    <small class="text-muted">
                        Enter Breakfast | Lunch | Dinner for each day.
                    </small>

                </div>
                <!-- Amenities -->
                <div class="col-md-12">

                    <label class="form-label">
                        Amenities
                    </label>

                    <textarea th:field="*{amenities}"
                              class="form-control"
                              rows="3"
                              placeholder="Example: WiFi, Parking, AC, Attached Bathroom, Laundry, CCTV, Power Backup, Study Table">
    </textarea>

                    <small class="text-muted">
                        Enter amenities separated by commas.
                    </small>

                </div>

                <!-- Property Image -->
                <div class="col-md-12">
                    <label class="form-label">
                        Property Image
                    </label>

                    <input type="file"
                           name="imageFile"
                           class="form-control"
                           accept="image/*"
                           required>

                    <small class="text-muted">
                        Upload a photo of the PG or Flat
                    </small>
                </div>


                <!-- Available -->
                <div class="col-md-12">

                    <div class="form-check">

                        <input type="checkbox"
                               th:field="*{available}"
                               class="form-check-input"
                               id="available">

                        <label class="form-check-label"
                               for="available">
                            Property is currently available
                        </label>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="col-md-12 mt-4 d-flex gap-3">

                    <button type="submit"
                            class="btn-save">

                        <i class="fas fa-save"></i>
                        Save Property

                    </button>

                    <a href="/admin/dashboard"
                       class="btn-back">

                        <i class="fas fa-arrow-left"></i>
                        Back

                    </a>

                </div>

            </div>

        </form>

    </div>

</div>

</body>
</html>
