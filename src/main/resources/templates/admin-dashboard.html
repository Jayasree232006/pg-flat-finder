<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .navbar {
            background: #1a1a2e;
            padding: 15px 0;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
            font-size: 1.4rem;
        }

        .dashboard-title {
            margin-top: 40px;
            margin-bottom: 10px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .dashboard-subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            height: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .card-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4361ee, #4cc9f0);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .dashboard-card h3 {
            font-size: 2rem;
            font-weight: bold;
            color: #4361ee;
        }

        .dashboard-card h5 {
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 10px;
        }

        .dashboard-card p {
            color: #666;
            margin-bottom: 18px;
        }

        .btn-admin {
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 22px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .btn-admin:hover {
            background: #3046c9;
            color: white;
        }

        .btn-home {
            color: white;
            border: 1px solid #4cc9f0;
            border-radius: 50px;
            padding: 8px 18px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-home:hover {
            background: #4cc9f0;
            color: #1a1a2e;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center">

        <a class="navbar-brand" href="/admin/dashboard">
            🏠 PGFlatFinder Admin
        </a>

        <a href="/home" class="btn-home">
            <i class="fas fa-home"></i>
            View Website
        </a>

    </div>
</nav>


<!-- Dashboard -->
<div class="container">

    <h2 class="dashboard-title">
        📊 Admin Dashboard
    </h2>

    <p class="dashboard-subtitle">
        Manage all PG and Flat listings from here.
    </p>


    <div class="row g-4">

        <!-- Total Properties -->
        <div class="col-md-4">

            <div class="dashboard-card">

                <div class="card-icon">
                    <i class="fas fa-building"></i>
                </div>

                <h3 th:text="${totalProperties}">
                    0
                </h3>

                <p>
                    Total Properties
                </p>

            </div>

        </div>


        <!-- Add Property -->
        <div class="col-md-4">

            <div class="dashboard-card">

                <div class="card-icon">
                    <i class="fas fa-plus"></i>
                </div>

                <h5>
                    Add Property
                </h5>

                <p>
                    Add a new PG or Flat listing.
                </p>

                <a href="/admin/properties/add"
                   class="btn-admin">

                    <i class="fas fa-plus-circle"></i>
                    Add Property

                </a>

            </div>

        </div>


        <!-- Manage Properties -->
        <div class="col-md-4">

            <div class="dashboard-card">

                <div class="card-icon">
                    <i class="fas fa-list"></i>
                </div>

                <h5>
                    Manage Properties
                </h5>

                <p>
                    View, edit or delete property listings.
                </p>

                <a href="/admin/properties"
                   class="btn-admin">

                    <i class="fas fa-cog"></i>
                    Manage Properties

                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
