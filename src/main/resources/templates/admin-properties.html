<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Properties - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .navbar {
            background: #1a1a2e;
            padding: 15px 0;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
            font-size: 1.4rem;
            text-decoration: none;
        }

        .page-container {
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .page-title {
            color: #1a1a2e;
            font-weight: 700;
        }

        .page-subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .table-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        .table {
            vertical-align: middle;
            margin-bottom: 0;
        }

        .table thead th {
            background: #1a1a2e;
            color: white;
            border: none;
            padding: 14px;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 14px;
        }

        .status-available {
            background: #d4edda;
            color: #1e7e34;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .status-unavailable {
            background: #f8d7da;
            color: #c82333;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .btn-add {
            background: #4361ee;
            color: white;
            border-radius: 50px;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: 700;
        }

        .btn-add:hover {
            background: #3046c9;
            color: white;
        }

        .btn-edit {
            background: #f39c12;
            color: white;
            border-radius: 8px;
            padding: 7px 12px;
            text-decoration: none;
            display: inline-block;
            margin-right: 5px;
        }

        .btn-edit:hover {
            background: #d68910;
            color: white;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 7px 12px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-delete:hover {
            background: #c0392b;
            color: white;
        }

        .btn-back {
            color: white;
            border: 1px solid #4cc9f0;
            border-radius: 50px;
            padding: 8px 18px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-back:hover {
            background: #4cc9f0;
            color: #1a1a2e;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #777;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">

        <a class="navbar-brand"
           href="/admin/dashboard">
            🏠 PGFlatFinder Admin
        </a>

        <a href="/admin/dashboard"
           class="btn-back">
            <i class="fas fa-arrow-left"></i>
            Dashboard
        </a>

    </div>
</nav>


<!-- Main Content -->
<div class="container page-container">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="page-title">
                <i class="fas fa-building"></i>
                Manage Properties
            </h2>

            <p class="page-subtitle">
                View, edit and delete property listings.
            </p>
        </div>

        <a href="/admin/properties/add"
           class="btn-add">

            <i class="fas fa-plus-circle"></i>
            Add Property

        </a>

    </div>


    <!-- Property Table -->
    <div class="table-card">

        <table class="table table-hover"
               th:if="${!#lists.isEmpty(properties)}">

            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Type</th>
                <th>Gender</th>
                <th>Location</th>
                <th>Rent</th>
                <th>Rooms</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="property : ${properties}">

                <td th:text="${property.id}">
                    1
                </td>

                <td th:text="${property.title}">
                    Property Title
                </td>

                <td th:text="${property.type}">
                    PG
                </td>

                <td th:text="${property.gender}">
                    Boys
                </td>

                <td th:text="${property.location}">
                    Location
                </td>

                <td>
                    ₹<span th:text="${property.rent}">
                        0
                    </span>
                </td>

                <td th:text="${property.rooms}">
                    1
                </td>

                <td>

                    <span class="status-available"
                          th:if="${property.available}">
                        Available
                    </span>

                    <span class="status-unavailable"
                          th:unless="${property.available}">
                        Not Available
                    </span>

                </td>

                <td>

                    <a th:href="@{/admin/properties/edit/{id}(id=${property.id})}"
                       class="btn-edit">

                        <i class="fas fa-edit"></i>
                        Edit

                    </a>

                    <a th:href="@{/admin/properties/delete/{id}(id=${property.id})}"
                       class="btn-delete"
                       onclick="return confirm('Are you sure you want to delete this property?')">

                        <i class="fas fa-trash"></i>
                        Delete

                    </a>

                </td>

            </tr>

            </tbody>

        </table>


        <!-- No Properties -->
        <div class="empty-message"
             th:if="${#lists.isEmpty(properties)}">

            <i class="fas fa-building fa-3x mb-3"></i>

            <h5>No properties found</h5>

            <p>
                Add your first property listing.
            </p>

        </div>

    </div>

</div>

</body>
</html>
